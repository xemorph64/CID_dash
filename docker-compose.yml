services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cidlocaldev}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cidlocaldev}
      POSTGRES_DB: ${POSTGRES_DB:-cid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cid} -d ${POSTGRES_DB:-cid}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
  postgres_data:
