[project]
name = "cid"
version = "0.1.0"
description = "C.I.D. prototype backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "psycopg[binary]",
    "neo4j",
    "pyyaml",
    "python-dotenv",
    "faker>=40.38.0",
    "indic-transliteration>=2.3.82",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",  # required by fastapi.testclient.TestClient, used in test_health.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cid"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# /api/health must report each DB's status independently and never raise —
# a broad, silent catch here is the point, not an oversight.
"cid/api/main.py" = ["BLE001", "S110"]
